<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - videobelajar</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/login.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="auth-page">
  <header class="auth-header"><a class="logo" href="../index.html" aria-label="videobelajar Beranda"><img src="../assets/images/logo.png" alt="videobelajar"></a></header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Masuk ke Akun</h1>
      <p>Yuk, lanjutkan belajar dan raih tujuanmu.</p>
      <form class="demo-form" data-success="Berhasil masuk. Ini adalah simulasi tanpa backend.">
        <div class="form-group"><label class="form-label" for="email">E-mail <span class="required">*</span></label><input class="form-input" id="email" type="email" placeholder="Masukkan e-mail" required></div>
        <div class="form-group"><label class="form-label" for="password">Kata Sandi <span class="required">*</span></label><div class="input-wrap"><input class="form-input" id="password" type="password" placeholder="Masukkan kata sandi" minlength="6" required><button class="password-toggle" type="button" data-password-toggle="password">Tampilkan</button></div></div>
        <a class="forgot" href="#login-title">Lupa Password?</a>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Masuk</button><a class="btn btn-soft" href="register.html">Daftar</a></div>
        <div class="divider"><span>atau</span></div>
        <button class="btn btn-google" type="button"><img class="google-icon" src="../assets/icons/logos_google-icon.png" alt="">Masuk dengan Google</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Belum punya akun? <a class="text-link" href="register.html">Daftar sekarang</a></p>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
