<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - videobelajar</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="stylesheet" href="assets/css/register.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <header class="auth-header"><a class="logo" href="index.html" aria-label="videobelajar Beranda"><img src="assets/images/logo.png" alt="videobelajar"></a></header>
  <main class="auth-main">
    <section class="auth-card" aria-labelledby="register-title">
      <h1 id="register-title">Pendaftaran Akun</h1>
      <p>Mulai perjalanan belajar bersama videobelajar.</p>
      <form class="demo-form" data-success="Akun berhasil dibuat. Ini adalah simulasi tanpa backend.">
        <div class="form-group"><label class="form-label" for="name">Nama <span class="required">*</span></label><input class="form-input" id="name" type="text" placeholder="Masukkan nama lengkap" required></div>
        <div class="form-group"><label class="form-label" for="register-email">E-mail <span class="required">*</span></label><input class="form-input" id="register-email" type="email" placeholder="Masukkan e-mail" required></div>
        <div class="form-group"><label class="form-label" for="phone">Nomor HP <span class="required">*</span></label><div class="phone-row"><span class="country-code" aria-label="Kode negara Indonesia">+62</span><input class="form-input" id="phone" type="tel" placeholder="812 3456 7890" required></div></div>
        <div class="form-group"><label class="form-label" for="register-password">Kata Sandi <span class="required">*</span></label><div class="input-wrap"><input class="form-input" id="register-password" type="password" placeholder="Minimal 6 karakter" minlength="6" required><button class="password-toggle" type="button" data-password-toggle="register-password">Tampilkan</button></div></div>
        <div class="form-group"><label class="form-label" for="confirm-password">Konfirmasi Kata Sandi <span class="required">*</span></label><div class="input-wrap"><input class="form-input" id="confirm-password" type="password" placeholder="Ulangi kata sandi" minlength="6" required><button class="password-toggle" type="button" data-password-toggle="confirm-password">Tampilkan</button></div></div>
        <a class="forgot" href="#register-title">Lupa Password?</a>
        <div class="form-actions"><button class="btn btn-primary" type="submit">Daftar</button><a class="btn btn-soft" href="login.html">Masuk</a></div>
        <div class="divider"><span>atau</span></div>
        <button class="btn btn-google" type="button"><img class="google-icon" src="assets/icons/logos_google-icon.png" alt=""> SSO dengan Google</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Sudah punya akun? <a class="text-link" href="login.html">Masuk sekarang</a></p>
    </section>
  </main>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
